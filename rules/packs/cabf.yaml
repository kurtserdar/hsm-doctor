# CA/Browser Forum Baseline Requirements inspired rules for tokens hosting
# TLS PKI material.
pack:
  name: cabf
  description: >-
    Rules inspired by the CA/Browser Forum TLS Baseline Requirements for
    tokens that hold CA or subscriber TLS material. Guidance only — passing
    this pack is not a compliance or certification statement.

rules:
  - id: CABF-001
    title: Subscriber certificate valid longer than 398 days
    severity: medium
    description: >-
      TLS subscriber certificates issued after 2020-09-01 must not exceed
      398 days of validity; browsers reject longer ones.
    remediation: >-
      Re-issue the subscriber certificate with a validity period of 398 days
      or fewer.
    match:
      class: certificate
      cert_is_ca: false
      cert_validity_days_gt: 398

  - id: CABF-002
    title: Certificate signed with SHA-1 or MD5
    severity: high
    description: SHA-1 TLS certificates have been forbidden since 2016.
    remediation: Re-issue the certificate with a SHA-256 (or stronger) signature.
    match:
      class: certificate
      cert_sig_alg_in: [SHA1-RSA, MD5-RSA, ECDSA-SHA1]

  - id: CABF-003
    title: RSA key below 2048 bits
    severity: high
    description: The Baseline Requirements set 2048 bits as the RSA minimum.
    remediation: >-
      Replace with an RSA-2048+ key (RSA-3072 preferred) and re-issue the
      certificate.
    match:
      class: private-key
      key_type: RSA
      key_size_lt: 2048

  - id: CABF-004
    title: EC key on a curve outside P-256/P-384/P-521
    severity: medium
    description: >-
      The Baseline Requirements only allow the NIST P-256, P-384 and P-521
      curves for TLS hierarchies.
    remediation: Re-key on P-256, P-384 or P-521 and re-issue the certificate.
    match:
      class: private-key
      key_type: EC
      curve_not_in: [P-256, P-384, P-521]

  - id: CABF-005
    title: Expired certificate
    severity: high
    description: The certificate's validity period has ended.
    remediation: Re-issue the certificate and remove the expired object from the token.
    match:
      class: certificate
      cert_expired: true

  - id: CABF-006
    title: Certificate expiring within 30 days
    severity: medium
    description: Renew before browsers and clients start failing.
    remediation: Renew the certificate before it expires and roll it onto the token.
    match:
      class: certificate
      cert_expires_within_days: 30

  - id: CABF-007
    title: Certificate past 80% of its lifetime
    severity: medium
    description: >-
      Renewal should start well before expiry. Judging by percentage of the
      lifetime — rather than a fixed number of days — keeps the same policy
      correct across 47-, 100-, 200- and 398-day certificates as the CA/Browser
      Forum shortens maximum validity.
    remediation: >-
      Renew now so the new certificate is deployed and verified with margin to
      spare before the current one expires.
    reference: https://www.digicert.com/blog/tls-certificate-lifetimes-will-officially-reduce-to-47-days
    match:
      class: certificate
      cert_lifetime_remaining_pct_lt: 20

  - id: CABF-008
    title: Short-lived certificate without renewal automation
    severity: info
    description: >-
      This certificate's total validity is short enough that manual renewal is
      not sustainable; from 2029 public TLS certificates are capped at 47 days.
      Ensure an automated enrollment and deployment path exists for it.
    remediation: >-
      Put this certificate on an automated (e.g. ACME) issuance and deployment
      pipeline so it renews without manual steps.
    reference: https://www.digicert.com/blog/tls-certificate-lifetimes-will-officially-reduce-to-47-days
    match:
      class: certificate
      cert_validity_days_lt: 48
