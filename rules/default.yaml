# HSM Doctor default security posture rules.
#
# Customize by copying this file and passing it to scan via --rules, or
# combine it with other packs via repeated --pack flags.
# Every field under "match" must hold for a rule to fire (logical AND).
# See docs/rules.md for the full condition reference.
pack:
  name: default
  description: Balanced baseline covering the most common HSM misconfigurations.

scoring:
  critical: 25
  high: 10
  medium: 5
  low: 2

rules:
  - id: HSM-001
    title: Extractable private key
    severity: critical
    description: >-
      A private key with CKA_EXTRACTABLE=true can be wrapped and exported
      from the HSM. Production signing and decryption keys should never be
      extractable.
    remediation: >-
      Regenerate the key on the HSM with CKA_EXTRACTABLE=false; extractability
      cannot be removed from an existing key.
    match:
      class: private-key
      extractable: true

  - id: HSM-002
    title: Private key not marked sensitive
    severity: critical
    description: >-
      A private key with CKA_SENSITIVE=false may reveal key material through
      C_GetAttributeValue on some implementations.
    remediation: >-
      Regenerate the key with CKA_SENSITIVE=true; sensitivity cannot be added
      to an existing key.
    match:
      class: private-key
      sensitive: false

  - id: HSM-003
    title: Weak RSA key
    severity: high
    description: >-
      RSA keys shorter than 2048 bits are considered broken for new use and
      are disallowed by NIST SP 800-57 since 2013.
    remediation: >-
      Replace with an RSA-3072+ or ECC P-256+ key and re-issue any certificates
      bound to it.
    reference: https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final
    match:
      class: private-key
      key_type: RSA
      key_size_lt: 2048

  - id: HSM-004
    title: Expired certificate
    severity: high
    description: The certificate's validity period has ended.
    remediation: >-
      Re-issue the certificate and remove the expired object from the token.
    match:
      class: certificate
      cert_expired: true

  - id: HSM-005
    title: Certificate expiring soon
    severity: medium
    description: The certificate expires within the next 30 days.
    remediation: Renew the certificate before it expires and roll it onto the token.
    match:
      class: certificate
      cert_expires_within_days: 30

  - id: HSM-006
    title: Duplicate object label
    severity: medium
    description: >-
      Multiple objects of the same class share a CKA_LABEL. Applications
      selecting keys by label may silently pick the wrong object.
    remediation: >-
      Give each object a unique CKA_LABEL, or select keys by CKA_ID instead of
      label.
    match:
      duplicate_label: true

  - id: HSM-007
    title: Orphan private key
    severity: medium
    description: >-
      No certificate or public key shares this private key's CKA_ID. The key
      may be leftover from an incomplete rotation or deletion.
    remediation: >-
      Confirm the key is unused, then delete it — or restore its matching
      certificate or public key.
    match:
      class: private-key
      orphan: true

  - id: HSM-008
    title: Orphan certificate
    severity: low
    description: >-
      No private key shares this certificate's CKA_ID. The certificate may
      be stale and safe to remove.
    remediation: >-
      Delete the stale certificate, or import the matching private key if it
      belongs on this token.
    match:
      class: certificate
      orphan: true

  - id: HSM-009
    title: Signing key can also decrypt
    severity: medium
    description: >-
      A key that both signs and decrypts mixes usage roles, widening the
      impact of a compromise and enabling cross-protocol attacks.
    remediation: >-
      Split the roles into separate signing and decryption keys, each with a
      single usage.
    match:
      class: private-key
      sign: true
      decrypt: true

  - id: HSM-010
    title: Weak mechanisms enabled
    severity: medium
    description: >-
      The token advertises legacy mechanisms (SHA-1 or MD5 signatures,
      single DES). Disable them where the HSM configuration allows it.
    remediation: >-
      Disable the legacy mechanisms in the HSM or partition policy where the
      vendor allows it.
    match:
      mechanism_any_of:
        - CKM_SHA1_RSA_PKCS
        - CKM_MD5_RSA_PKCS
        - CKM_DES_CBC
        - CKM_DES_ECB

  - id: HSM-011
    title: Certificate signed with SHA-1 or MD5
    severity: medium
    description: >-
      The certificate uses a broken signature algorithm (SHA-1 or MD5).
      These are forgeable and disallowed for new certificates.
    remediation: Re-issue the certificate with a SHA-256 (or stronger) signature.
    match:
      class: certificate
      cert_sig_alg_in: [SHA1-RSA, MD5-RSA, ECDSA-SHA1]

  - id: HSM-012
    title: Secret key not marked sensitive
    severity: high
    description: >-
      A secret key with CKA_SENSITIVE=false may reveal its value through
      C_GetAttributeValue. Symmetric keys should always be sensitive.
    remediation: Regenerate the secret key with CKA_SENSITIVE=true.
    match:
      class: secret-key
      sensitive: false

  - id: HSM-013
    title: Extractable secret key
    severity: high
    description: >-
      A secret key with CKA_EXTRACTABLE=true can be wrapped and exported.
      Production symmetric keys should not be extractable.
    remediation: >-
      Regenerate the secret key with CKA_EXTRACTABLE=false; use wrap/unwrap
      only for keys explicitly meant to leave the HSM.
    match:
      class: secret-key
      extractable: true

  - id: HSM-014
    title: Self-signed leaf certificate
    severity: low
    description: >-
      A self-signed certificate that is not a CA is not anchored to a real
      trust chain — often a leftover test or placeholder certificate.
    remediation: >-
      Replace with a certificate issued by your CA, or remove the placeholder
      if it is a leftover.
    match:
      class: certificate
      cert_self_signed: true
      cert_is_ca: false

  - id: HSM-015
    title: Certificate not yet valid
    severity: medium
    description: >-
      The certificate's notBefore is in the future. It will not be accepted
      until then — usually a clock problem or a premature deployment.
    remediation: >-
      Check the host clock and the certificate's notBefore; re-issue if the
      date is wrong.
    match:
      class: certificate
      cert_not_yet_valid: true

  - id: HSM-016
    title: Weak RSA certificate key
    severity: high
    description: >-
      The certificate's own RSA public key is shorter than 2048 bits and is
      considered broken for new use, regardless of the HSM key protecting it.
    remediation: Re-issue the certificate with an RSA-3072+ or ECC key.
    reference: https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final
    match:
      class: certificate
      cert_pubkey_alg_in: [RSA]
      cert_key_size_lt: 2048

  - id: HSM-017
    title: CA certificate without keyCertSign
    severity: medium
    description: >-
      A certificate marked as a CA (basicConstraints CA:TRUE) but missing the
      keyCertSign key usage is malformed and will be rejected by many clients.
    remediation: >-
      Re-issue the CA certificate with the keyCertSign key usage set.
    match:
      class: certificate
      cert_ca_without_keycertsign: true

  - id: HSM-018
    title: Certificate does not match its key
    severity: high
    description: >-
      The certificate shares its CKA_ID with a key on the token, but its
      public key does not match that key — a mislabeled or wrong certificate
      that will break signing and TLS.
    remediation: >-
      Import the certificate that matches this key, or correct the CKA_ID so
      the certificate and key line up.
    match:
      class: certificate
      cert_key_mismatch: true

  - id: HSM-019
    title: Certificate chain does not validate
    severity: medium
    description: >-
      The certificate does not build a valid chain to the supplied trust
      anchors (--ca-bundle) — a missing intermediate, an expired issuer or an
      untrusted root. Only evaluated when a CA bundle is provided.
    remediation: >-
      Add the missing intermediate or root to the token or the CA bundle, or
      renew the issuer if it has expired.
    match:
      class: certificate
      cert_chain_broken: true
