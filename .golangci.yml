version: "2"

linters:
  settings:
    errcheck:
      # Report renderers write to an io.Writer (usually stdout); checking
      # every fmt.Fprint* call adds noise without improving safety.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Closing an HTTP response body in deferred test cleanup.
        - (io.ReadCloser).Close
        # Deferred cleanup of read-only query results and test databases.
        - (*database/sql.Rows).Close
        - (*github.com/kurtserdar/hsm-doctor/internal/store.DB).Close
        - (github.com/kurtserdar/hsm-doctor/internal/store.Store).Close
        # Deferred cleanup of a KMIP client connection.
        - (*github.com/kurtserdar/hsm-doctor/internal/kmip.Client).Close
