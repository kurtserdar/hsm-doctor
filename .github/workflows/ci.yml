name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: hsmdoctor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HSMDOCTOR_TEST_POSTGRES: postgres://postgres:secret@127.0.0.1:5432/hsmdoctor?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Install SoftHSM2 and OpenSC
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-ed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.0

      - name: Lint (integration tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.0
          args: --build-tags integration

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Integration tests (SoftHSM)
        run: go test -tags=integration -v ./...

      - name: Flight Recorder shim end-to-end
        run: |
          make shim
          export HSMDOCTOR_TRACE_MODULE=/usr/lib/softhsm/libsofthsm2.so
          export SOFTHSM2_CONF="$PWD/ci-softhsm.conf"
          mkdir -p ci-tokens
          printf 'directories.tokendir = %s/ci-tokens\n' "$PWD" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --free --label CI --so-pin 12345678 --pin 123456
          export HSMDOCTOR_TRACE_OUT="$PWD/ci-trace.jsonl"
          # Drive the real module through the shim.
          pkcs11-tool --module ./hsmdoctor-trace.so --list-token-slots
          pkcs11-tool --module ./hsmdoctor-trace.so --login --pin 123456 \
            --keypairgen --key-type rsa:2048 --label ci-key --id 01
          go build -o hsmdoctor ./cmd/hsmdoctor
          ./hsmdoctor trace analyze "$HSMDOCTOR_TRACE_OUT"
          # The trace must contain calls and must never contain the PIN.
          test -s "$HSMDOCTOR_TRACE_OUT"
          if grep -q 123456 "$HSMDOCTOR_TRACE_OUT"; then
            echo "PIN leaked into trace!" >&2
            exit 1
          fi

  # Positive-path PQC test against Kryoptic (a PKCS#11 3.2 soft token with
  # real ML-KEM/ML-DSA support). Non-blocking while the ecosystem matures.
  # Runs in a Fedora container because the pqc feature needs an OpenSSL 3.5+
  # libcrypto, which Fedora ships (same approach as Kryoptic's own CI).
  pqc-kryoptic:
    name: PQC positive path (Kryoptic)
    runs-on: ubuntu-latest
    container: quay.io/fedora/fedora:latest
    continue-on-error: true
    steps:
      - name: Install dependencies
        run: |
          dnf -y install git cargo clang-devel openssl-devel sqlite-devel \
            pkgconf-pkg-config opensc golang gcc

      - name: Check out source
        uses: actions/checkout@v7

      # The cargo target dir lives OUTSIDE the clone so restoring the cache
      # never pre-creates a non-empty kryoptic-src that would break the clone.
      - name: Cache Kryoptic build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/kryoptic-target
          key: kryoptic-fedora-v2

      - name: Build Kryoptic
        env:
          CARGO_TARGET_DIR: /root/kryoptic-target
        run: |
          rm -rf kryoptic-src
          git clone --depth 1 https://github.com/latchset/kryoptic kryoptic-src
          cd kryoptic-src
          cargo build --release --no-default-features --features standard,pqc,openssl-sys
          test -f /root/kryoptic-target/release/libkryoptic_pkcs11.so

      - name: Initialize PQC token and run positive-path test
        run: |
          export KRYOPTIC_CONF="$PWD/kryoptic-token.sql"
          export HSMDOCTOR_PQC_MODULE="/root/kryoptic-target/release/libkryoptic_pkcs11.so"
          pkcs11-tool --module "$HSMDOCTOR_PQC_MODULE" --init-token --label PQC-CI --so-pin 12345678
          pkcs11-tool --module "$HSMDOCTOR_PQC_MODULE" --login --login-type so --so-pin 12345678 --init-pin --pin 123456
          go test -tags=integration -v -run TestPositivePathAgainstPQCModule ./internal/pqc/
