name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build

      - name: Install SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-ed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3.0

      - name: Lint (integration tag)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3.0
          args: --build-tags integration

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      - name: Integration tests (SoftHSM)
        run: go test -tags=integration -v ./...

  # Positive-path PQC test against Kryoptic (a PKCS#11 3.2 soft token with
  # real ML-KEM/ML-DSA support). Non-blocking while the ecosystem matures.
  pqc-kryoptic:
    name: PQC positive path (Kryoptic)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config opensc

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Kryoptic build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/kryoptic/target
          key: kryoptic-${{ runner.os }}-v1

      - name: Build Kryoptic
        run: |
          if [ ! -d "$HOME/kryoptic/.git" ]; then
            git clone --depth 1 https://github.com/latchset/kryoptic "$HOME/kryoptic"
          fi
          cd "$HOME/kryoptic"
          # Drop the default "dynamic" feature: the pqc feature needs an
          # OpenSSL 3.5+ libcrypto, so build against the vendored one
          # instead of whatever the runner image ships.
          cargo build --release --no-default-features --features standard,pqc
          test -f target/release/libkryoptic_pkcs11.so

      - name: Initialize PQC token
        run: |
          export KRYOPTIC_CONF="$HOME/kryoptic-token.sql"
          MODULE="$HOME/kryoptic/target/release/libkryoptic_pkcs11.so"
          pkcs11-tool --module "$MODULE" --init-token --label PQC-CI --so-pin 12345678
          pkcs11-tool --module "$MODULE" --login --login-type so --so-pin 12345678 --init-pin --pin 123456
          echo "KRYOPTIC_CONF=$KRYOPTIC_CONF" >> "$GITHUB_ENV"
          echo "HSMDOCTOR_PQC_MODULE=$MODULE" >> "$GITHUB_ENV"

      - name: Run positive-path PQC test
        run: go test -tags=integration -v -run TestPositivePathAgainstPQCModule ./internal/pqc/
