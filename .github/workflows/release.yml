name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build binaries for (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: macos-14, os: darwin, arch: arm64 }
          - { runner: windows-latest, os: windows, arch: amd64 }
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Build web UI
        if: hashFiles('web/package.json') != ''
        shell: bash
        run: |
          cd web
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          COMMIT=$(git rev-parse --short HEAD)
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          go build -trimpath \
            -ldflags "-X github.com/kurtserdar/hsm-doctor/internal/version.Version=$VERSION \
                      -X github.com/kurtserdar/hsm-doctor/internal/version.Commit=$COMMIT" \
            -o "hsmdoctor$EXT" ./cmd/hsmdoctor

      - name: Package
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NAME="hsmdoctor_${TAG#v}_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir "$NAME"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp hsmdoctor.exe LICENSE README.md "$NAME/"
            7z a "$NAME.zip" "$NAME" > /dev/null
          else
            cp hsmdoctor LICENSE README.md "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign signing via GitHub OIDC
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: "."
          format: "cyclonedx-json"
          output-file: "hsmdoctor.sbom.cyclonedx.json"
          upload-artifact: false
          upload-release-assets: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Assemble checksums (binaries + SBOM)
        run: |
          mv hsmdoctor.sbom.cyclonedx.json dist/
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign checksums (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cd dist
          cosign sign-blob SHA256SUMS.txt --bundle SHA256SUMS.txt.cosign.bundle

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign image signing
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false" # skip the .dockerbuild run artifact
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/kurtserdar/hsm-doctor:${{ steps.tag.outputs.tag }}
            ghcr.io/kurtserdar/hsm-doctor:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign ghcr.io/kurtserdar/hsm-doctor@${{ steps.build.outputs.digest }}
