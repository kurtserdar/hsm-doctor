version: 2

# Dependency updates are grouped into a single PR per ecosystem to keep the
# review load low for a small maintainer team.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      # vue-tsc is not yet compatible with the native TypeScript 7 compiler
      # (TS 7 drops the ./lib/tsc entry point vue-tsc relies on). Remove this
      # once vue-tsc supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
